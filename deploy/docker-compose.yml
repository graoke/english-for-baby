version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peppa-backend
    ports:
      - "8001:8001"
    volumes:
      # 模型目录（持久化，避免重复下载）
      - ./data/models:/app/data/models
      # 运行时数据
      - ./data/audio:/app/data/audio
      - ./data/images:/app/data/images
      - ./data/recordings:/app/data/recordings
      - ./data/logs:/app/data/logs
      # SQLite 数据库
      - ./data:/app/data
    environment:
      - WHISPER_MODEL_PATH=/app/data/models/whisper
      - MINICPM_GGUF_PATH=/app/data/models/minicpm-phonetic-evaluator-q4_k_m.gguf
      # 腾讯云 TTS（可选）
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: peppa-frontend
    ports:
      - "5174:80"
    volumes:
      # 前端静态文件
      - ./web/dist:/usr/share/nginx/html:ro
      # Nginx 配置（处理 SPA 路由）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
