services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: peppa-backend
    ports:
      - "8001:8001"
    volumes:
      # 数据目录（与 database.py 的 DATA_DIR 一致：/app/server/data）
      - ../server/data:/app/server/data
    environment:
      - MINICPM_GGUF_PATH=/app/server/data/models/minicpm-phonetic-evaluator-q4_k_m.gguf
      # 腾讯云 TTS（可选）
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
    restart: unless-stopped
