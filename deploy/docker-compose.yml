version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: peppa-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ../server/data:/app/server/data
    env_file:
      - ../.env
    environment:
      - PORT=8001
      - PUBLIC_URL=http://localhost:8001
      - WHISPER_MODEL_PATH=/app/server/data/models

  nginx:
    image: nginx:alpine
    container_name: peppa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
